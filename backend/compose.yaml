services:
  api:
    build: .
    env_file: .env
    command: ["uvicorn", "signalos_backend.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"

  market-worker:
    build: .
    env_file: .env
    command: ["signalos-market-worker"]
    restart: unless-stopped

  execution-worker:
    build: .
    env_file: .env
    command: ["signalos-execution-worker"]
    restart: unless-stopped

  notification-worker:
    build: .
    env_file: .env
    command: ["signalos-notification-worker"]
    restart: unless-stopped
