[project]
name = "signalos-backend"
version = "0.1.0"
description = "Governed financial intelligence platform for SignalOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5",
  "asyncpg>=0.30.0",
  "cryptography>=49.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "logfire[fastapi,httpx,sqlalchemy]>=4.0.0",
  "openai>=1.100.0",
  "pydantic>=2.11.0",
  "pydantic-ai-slim[openai]>=2.9.0,<2.10.0",
  "pydantic-evals>=2.9.0,<2.10.0",
  "pydantic-settings>=2.10.0",
  "pyjwt[crypto]>=2.10.1",
  "pyyaml>=6.0.2",
  "sqlalchemy[asyncio]>=2.0.40",
  "temporalio>=1.15.0",
  "uvicorn[standard]>=0.35.0",
]

[project.scripts]
signalos-execution-worker = "signalos_backend.execution.worker:main"
signalos-market-worker = "signalos_backend.market.worker:main"
signalos-notification-worker = "signalos_backend.notifications.worker:main"

[project.optional-dependencies]
research = ["pydantic-ai-harness[codemode]>=0.1.0"]
dev = [
  "aiosqlite>=0.21.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalos_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
